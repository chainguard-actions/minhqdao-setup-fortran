name: Test default compiler (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
      - id: action
        uses: .
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected non-empty version output from default compiler"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran is on PATH (default compiler)
        run: |
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran (default compiler) not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
      - name: Assert FORTRAN_COMPILER env var is set
        run: |
          echo "FORTRAN_COMPILER: $FORTRAN_COMPILER"
          if [ -z "$FORTRAN_COMPILER" ]; then
            echo "FAIL: FORTRAN_COMPILER env var not set"
            exit 1
          fi
          if [ "$FORTRAN_COMPILER" != "gfortran" ]; then
            echo "FAIL: expected FORTRAN_COMPILER=gfortran, got $FORTRAN_COMPILER"
            exit 1
          fi
          echo "PASS: FORTRAN_COMPILER=$FORTRAN_COMPILER"
