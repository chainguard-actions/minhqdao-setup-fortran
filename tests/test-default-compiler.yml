name: Test default compiler (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert default gfortran outputs are set
        env:
          VERSION: ${{ steps.action.outputs.version }}
          FC: ${{ steps.action.outputs.fc }}
          CC: ${{ steps.action.outputs.cc }}
          CXX: ${{ steps.action.outputs.cxx }}
        run: |
          echo "version: $VERSION"
          echo "fc: $FC"
          echo "cc: $CC"
          echo "cxx: $CXX"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ -z "$FC" ]; then
            echo "FAIL: fc output is empty"
            exit 1
          fi
          echo "PASS: default compiler outputs are set"
      - name: Assert default compiler (gfortran) is available
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "FC: $FC"
          if ! command -v "$FC" > /dev/null 2>&1; then
            echo "FAIL: default Fortran compiler '$FC' not found in PATH"
            exit 1
          fi
          VERSION_OUTPUT=$("$FC" --version 2>&1 | head -1)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qi "gfortran\|gnu fortran"; then
            echo "PASS: default gfortran compiler is available"
          else
            echo "FAIL: expected gfortran in version output: $VERSION_OUTPUT"
            exit 1
          fi
