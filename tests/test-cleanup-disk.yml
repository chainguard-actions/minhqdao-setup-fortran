name: Test gfortran setup with cleanup-disk enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          compiler: gfortran
          cleanup-disk: "true"
      - name: Assert fc output is set
        env:
          FC: ${{ steps.setup.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: expected fc output to be non-empty"
            exit 1
          fi
          echo "PASS: fc=$FC"
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert cc output is set
        env:
          CC: ${{ steps.setup.outputs.cc }}
        run: |
          echo "cc: $CC"
          if [ -z "$CC" ]; then
            echo "FAIL: expected cc output to be non-empty"
            exit 1
          fi
          echo "PASS: cc=$CC"
      - name: Assert cxx output is set
        env:
          CXX: ${{ steps.setup.outputs.cxx }}
        run: |
          echo "cxx: $CXX"
          if [ -z "$CXX" ]; then
            echo "FAIL: expected cxx output to be non-empty"
            exit 1
          fi
          echo "PASS: cxx=$CXX"
      - name: Assert gfortran is callable
        env:
          FC: ${{ steps.setup.outputs.fc }}
        run: |
          echo "Checking gfortran is callable via fc=$FC"
          if ! command -v "$FC" > /dev/null 2>&1; then
            echo "FAIL: $FC not found on PATH"
            exit 1
          fi
          "$FC" --version
          echo "PASS: gfortran is callable after cleanup-disk"
