name: Test ifx (Intel Fortran) compiler setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: ifx
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected non-empty version output"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert ifx is on PATH
        run: |
          if ! command -v ifx &>/dev/null; then
            echo "FAIL: ifx not found on PATH"
            exit 1
          fi
          echo "PASS: ifx found at $(command -v ifx)"
      - name: Assert ifx can compile a simple program
        run: |
          cat > /tmp/hello_ifx.f90 <<'EOF'
          program hello
            print *, "Hello from ifx!"
          end program hello
          EOF
          ifx /tmp/hello_ifx.f90 -o /tmp/hello_ifx
          OUTPUT=$(/tmp/hello_ifx)
          echo "output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "Hello from ifx!"; then
            echo "FAIL: unexpected output from compiled Fortran program"
            exit 1
          fi
          echo "PASS: ifx compiled and ran successfully"
