name: Test setup-fortran with all defaults
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACTIONS_CACHE_URL: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure sudo is available
        run: |
          if ! command -v sudo &>/dev/null; then
            apt-get install -y sudo 2>/dev/null || true
          fi
          echo "sudo check done"
      - id: setup
        uses: .
      - name: Assert version output is non-empty
        env:
          ACTUAL: ${{ steps.setup.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert gfortran is available on PATH (default compiler)
        run: |
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found on PATH (expected default compiler)"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
      - name: Assert gfortran reports a version
        run: |
          VERSION_OUTPUT=$(gfortran --version)
          echo "gfortran --version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: gfortran --version returned empty output"
            exit 1
          fi
          echo "PASS: gfortran --version returned output"
