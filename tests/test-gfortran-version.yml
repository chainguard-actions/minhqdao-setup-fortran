name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: gfortran
          version: "13"
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert fc output is set
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: fc output is empty"
            exit 1
          fi
          echo "PASS: fc=$FC"
      - name: Assert gfortran version matches requested
        env:
          FC: ${{ steps.action.outputs.fc }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "Checking that FC=$FC is executable and version matches"
          if ! command -v "$FC" > /dev/null 2>&1; then
            echo "FAIL: $FC is not found on PATH"
            exit 1
          fi
          "$FC" --version
          # Check that the installed version starts with 13
          if ! echo "$VERSION" | grep -q "^13"; then
            echo "FAIL: expected version starting with 13, got $VERSION"
            exit 1
          fi
          echo "PASS: gfortran version $VERSION matches requested 13"
