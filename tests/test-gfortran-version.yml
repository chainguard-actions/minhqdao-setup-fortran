name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          compiler: gfortran
          version: "13"

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"

      - name: Assert fc output is set
        env:
          FC: ${{ steps.setup.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: fc output is empty"
            exit 1
          fi
          echo "PASS: fc=$FC"

      - name: Assert gfortran version matches requested
        env:
          FC: ${{ steps.setup.outputs.fc }}
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "Checking gfortran version"
          "$FC" --version
          ACTUAL_VERSION=$("$FC" --version | head -1)
          echo "actual version string: $ACTUAL_VERSION"
          # Check that version 13 is present in the output
          if ! echo "$ACTUAL_VERSION" | grep -q "13"; then
            echo "FAIL: expected version 13 in output, got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: gfortran version 13 confirmed"
