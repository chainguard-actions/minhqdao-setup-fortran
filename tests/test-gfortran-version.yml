name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare system
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q software-properties-common
      - id: action
        uses: .
        with:
          compiler: gfortran
          version: "13"
      - name: Assert version output matches requested version
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a non-empty version output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "13"; then
            echo "FAIL: expected version containing '13', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert gfortran is on PATH
        run: |
          if ! command -v gfortran >/dev/null 2>&1; then
            echo "FAIL: gfortran not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
          gfortran --version
