name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: gfortran
          version: "13"
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected non-empty version output"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran is on PATH
        run: |
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
      - name: Assert gfortran version matches requested
        run: |
          ACTUAL_VERSION=$(gfortran --version | head -1)
          echo "gfortran version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "13"; then
            echo "FAIL: expected gfortran version 13 but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: gfortran version 13 confirmed"
