name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: gfortran
          version: "13"
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran 13 is available
        run: |
          which gfortran || { echo "FAIL: gfortran not found on PATH"; exit 1; }
          gfortran --version
          INSTALLED=$(gfortran --version | head -1)
          echo "installed: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q "13"; then
            echo "FAIL: expected gfortran version 13 but got: $INSTALLED"
            exit 1
          fi
          echo "PASS: gfortran 13 is installed"
