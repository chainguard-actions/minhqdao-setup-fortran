name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: gfortran
          version: "12"
      - name: Assert version output contains 12
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if ! echo "$VERSION" | grep -q "12"; then
            echo "FAIL: expected version to contain 12, got: $VERSION"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert fc output is set and points to gfortran-12
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: fc output is empty"
            exit 1
          fi
          if ! echo "$FC" | grep -q "12"; then
            echo "FAIL: expected fc to reference version 12, got $FC"
            exit 1
          fi
          echo "PASS: fc=$FC"
      - name: Assert gfortran-12 is executable
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "Checking gfortran is callable via fc=$FC"
          if ! command -v "$FC" > /dev/null 2>&1; then
            echo "FAIL: $FC not found in PATH"
            exit 1
          fi
          "$FC" --version
          echo "PASS"
