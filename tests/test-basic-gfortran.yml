name: Test basic gfortran setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: gfortran
          version: "12"
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is non-empty"
      - name: Assert gfortran is available in PATH
        run: |
          echo "Checking gfortran availability..."
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found in PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
          gfortran --version
