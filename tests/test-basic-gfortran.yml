name: Test basic gfortran setup (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: gfortran
      - name: Assert version output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert gfortran is on PATH
        run: |
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
      - name: Assert gfortran can compile a simple program
        run: |
          cat > /tmp/hello.f90 << 'EOF'
          program hello
            print *, "Hello, Fortran!"
          end program hello
          EOF
          gfortran /tmp/hello.f90 -o /tmp/hello
          output=$(/tmp/hello)
          echo "Program output: $output"
          if echo "$output" | grep -q "Hello, Fortran!"; then
            echo "PASS: gfortran compiled and ran successfully"
          else
            echo "FAIL: unexpected output: $output"
            exit 1
          fi
