name: Test basic gfortran setup (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu22
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          compiler: gfortran
          version: "12"
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran is available on PATH
        run: |
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
      - name: Assert gfortran can compile a simple program
        run: |
          cat > /tmp/hello.f90 <<'EOF'
          program hello
            print *, "Hello, Fortran!"
          end program hello
          EOF
          gfortran /tmp/hello.f90 -o /tmp/hello
          output=$(/tmp/hello)
          echo "output: $output"
          if [[ "$output" != *"Hello, Fortran!"* ]]; then
            echo "FAIL: unexpected output from compiled Fortran program"
            exit 1
          fi
          echo "PASS"
