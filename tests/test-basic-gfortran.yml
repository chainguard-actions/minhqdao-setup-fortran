name: Test basic gfortran setup (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
      - id: action
        uses: .
        with:
          compiler: gfortran
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected non-empty version output"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran is on PATH
        run: |
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
      - name: Assert gfortran compiles a simple program
        run: |
          cat > /tmp/hello.f90 << 'EOF'
          program hello
            print *, "Hello, Fortran!"
          end program hello
          EOF
          gfortran /tmp/hello.f90 -o /tmp/hello
          OUTPUT=$(/tmp/hello)
          echo "output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "Hello, Fortran!"; then
            echo "PASS: gfortran compiled and ran successfully"
          else
            echo "FAIL: unexpected output: $OUTPUT"
            exit 1
          fi
