name: Test basic gfortran setup (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran is available on PATH
        run: |
          if ! command -v gfortran >/dev/null 2>&1; then
            echo "FAIL: gfortran not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
          gfortran --version
      - name: Assert FORTRAN_COMPILER env var is set
        run: |
          echo "FORTRAN_COMPILER=$FORTRAN_COMPILER"
          if [ -z "$FORTRAN_COMPILER" ]; then
            echo "FAIL: expected FORTRAN_COMPILER env var to be set"
            exit 1
          fi
          echo "PASS: FORTRAN_COMPILER=$FORTRAN_COMPILER"
