name: Test basic gfortran setup (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-fortran
        uses: .
        with:
          compiler: gfortran
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-fortran.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert fc output is set
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: expected fc output to be non-empty"
            exit 1
          fi
          echo "PASS: fc=$FC"
      - name: Assert cc output is set
        env:
          CC: ${{ steps.setup-fortran.outputs.cc }}
        run: |
          echo "cc: $CC"
          if [ -z "$CC" ]; then
            echo "FAIL: expected cc output to be non-empty"
            exit 1
          fi
          echo "PASS: cc=$CC"
      - name: Assert cxx output is set
        env:
          CXX: ${{ steps.setup-fortran.outputs.cxx }}
        run: |
          echo "cxx: $CXX"
          if [ -z "$CXX" ]; then
            echo "FAIL: expected cxx output to be non-empty"
            exit 1
          fi
          echo "PASS: cxx=$CXX"
      - name: Assert gfortran is executable
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
        run: |
          echo "Checking that FC=$FC is executable"
          if ! command -v "$FC" > /dev/null 2>&1; then
            echo "FAIL: $FC is not found in PATH"
            exit 1
          fi
          echo "PASS: $FC is available"
      - name: Assert gfortran can compile a simple program
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
        run: |
          cat > /tmp/hello.f90 << 'EOF'
          program hello
            print *, "Hello, Fortran!"
          end program hello
          EOF
          "$FC" /tmp/hello.f90 -o /tmp/hello
          /tmp/hello
          echo "PASS: gfortran compiled and ran successfully"
