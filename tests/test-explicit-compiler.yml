name: Test explicit compiler input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          compiler: gfortran
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran is on PATH and functional
        run: |
          if ! command -v gfortran >/dev/null 2>&1; then
            echo "FAIL: gfortran not found on PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
          gfortran --version
      - name: Assert FC environment variable is set
        run: |
          echo "FC=$FC"
          if [ -z "$FC" ]; then
            echo "FAIL: expected FC env var to be set"
            exit 1
          fi
          echo "PASS: FC=$FC"
      - name: Compile and run a simple Fortran program
        run: |
          cat > /tmp/hello.f90 << 'EOF'
          program hello
            print *, "Hello, Fortran!"
          end program hello
          EOF
          gfortran /tmp/hello.f90 -o /tmp/hello
          OUTPUT=$(/tmp/hello)
          echo "Output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "Hello, Fortran!"; then
            echo "FAIL: expected 'Hello, Fortran!' in output"
            exit 1
          fi
          echo "PASS: Fortran program compiled and ran successfully"
