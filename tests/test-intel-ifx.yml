name: Test Intel ifx compiler setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: ifx
        continue-on-error: true
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "fc: $FC"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FC" ]; then
              echo "FAIL: action succeeded but fc output is empty"
              exit 1
            fi
            echo "PASS: Intel ifx compiler set up successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Intel compiler may not be available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
