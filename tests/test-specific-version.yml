name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-fortran
        uses: .
        with:
          compiler: gfortran
          version: "13"
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup-fortran.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran-13 is available
        run: |
          echo "Checking gfortran availability..."
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found in PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(which gfortran)"
          gfortran --version
          # Verify the major version matches what was requested
          MAJOR=$(gfortran --version | head -1 | grep -oP '\d+' | head -1)
          echo "Detected major version: $MAJOR"
          if [ "$MAJOR" != "13" ]; then
            echo "FAIL: expected major version 13, got $MAJOR"
            exit 1
          fi
          echo "PASS: major version is 13"
