name: Test gfortran with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-fortran
        uses: .
        with:
          compiler: gfortran
          version: "12"
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.setup-fortran.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert gfortran is available
        run: |
          echo "Checking gfortran availability..."
          if ! command -v gfortran &>/dev/null; then
            echo "FAIL: gfortran not found in PATH"
            exit 1
          fi
          echo "PASS: gfortran found at $(command -v gfortran)"
          gfortran --version
      - name: Assert gfortran version matches requested
        run: |
          version_output=$(gfortran --version)
          echo "gfortran version output: $version_output"
          if [[ "$version_output" != *"12"* ]]; then
            echo "FAIL: expected version output to contain '12'"
            exit 1
          fi
          echo "PASS: version output contains '12'"
