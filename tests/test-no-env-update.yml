name: Test gfortran with update-environment false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: gfortran
          update-environment: "false"
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert fc output is set
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: expected fc output to be non-empty"
            exit 1
          fi
          echo "PASS: fc=$FC"
      - name: Assert cc output is set
        env:
          CC_OUT: ${{ steps.action.outputs.cc }}
        run: |
          echo "cc: $CC_OUT"
          if [ -z "$CC_OUT" ]; then
            echo "FAIL: expected cc output to be non-empty"
            exit 1
          fi
          echo "PASS: cc=$CC_OUT"
      - name: Assert cxx output is set
        env:
          CXX_OUT: ${{ steps.action.outputs.cxx }}
        run: |
          echo "cxx: $CXX_OUT"
          if [ -z "$CXX_OUT" ]; then
            echo "FAIL: expected cxx output to be non-empty"
            exit 1
          fi
          echo "PASS: cxx=$CXX_OUT"
