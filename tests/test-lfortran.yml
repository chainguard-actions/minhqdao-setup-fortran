name: Test lfortran setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: lfortran
          update-environment: "true"
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert fc output is set
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: expected fc output to be non-empty"
            exit 1
          fi
          echo "PASS: fc=$FC"
      - name: Assert lfortran is executable
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "Checking lfortran is on PATH or fc is executable"
          if command -v lfortran >/dev/null 2>&1; then
            echo "PASS: lfortran found on PATH"
          elif [ -n "$FC" ] && command -v "$FC" >/dev/null 2>&1; then
            echo "PASS: fc=$FC is executable"
          else
            echo "FAIL: lfortran not found on PATH and fc not executable"
            exit 1
          fi
