name: Test lfortran compiler setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: lfortran
          version: "0.63.0"
      - name: Assert version output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a non-empty version output"
            exit 1
          fi
          echo "PASS: version=$ACTUAL"
      - name: Assert lfortran is on PATH
        run: |
          if ! command -v lfortran >/dev/null 2>&1; then
            echo "FAIL: lfortran not found on PATH"
            exit 1
          fi
          echo "PASS: lfortran found at $(command -v lfortran)"
          lfortran --version
