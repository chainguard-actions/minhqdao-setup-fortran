name: Test lfortran compiler setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compiler: lfortran
          version: "0.64.0"
      - name: Assert fc output is set
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "fc: $FC"
          if [ -z "$FC" ]; then
            echo "FAIL: fc output is empty"
            exit 1
          fi
          echo "PASS: fc=$FC"
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert lfortran is executable
        env:
          FC: ${{ steps.action.outputs.fc }}
        run: |
          echo "Checking lfortran is callable via fc=$FC"
          if ! command -v "$FC" > /dev/null 2>&1; then
            echo "FAIL: $FC not found in PATH"
            exit 1
          fi
          "$FC" --version
          echo "PASS"
