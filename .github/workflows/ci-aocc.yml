name: aocc

on:
    push:
        branches: [ main ]
    pull_request:

permissions: {}

jobs:
    build:
        name: ci
        uses: ./.github/workflows/ci.yml

    integration-tests:
        name: ${{ matrix.toolchain.version }} ${{ matrix.image }} ${{
            matrix.toolchain.msystem }}
        runs-on: ${{ matrix.image }}
        needs: [ build ]
        strategy:
            fail-fast: false
            matrix:
                image: [ ubuntu-24.04, ubuntu-22.04 ]

                toolchain:
                    - { compiler: aocc, version: "5.1" }
                    - { compiler: aocc, version: "5.0" }
                    - { compiler: aocc, version: "4.2" }
                    - { compiler: aocc, version: "4.1" }

        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Restore dist-tests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: generated-dist-tests
                  path: dist-tests

            - name: Install ${{ matrix.toolchain.compiler }} ${{ matrix.toolchain.version }}
              id: setup
              uses: ./
              with:
                  compiler: ${{ matrix.toolchain.compiler }}
                  version: ${{ matrix.toolchain.version }}

            - name: Verify installed version
              env:
                SETUP_VERSION: ${{ steps.setup.outputs.version }}
              run: echo "Output: $SETUP_VERSION"

            - name: Run Integration Tests
              run: npm run integration-test
