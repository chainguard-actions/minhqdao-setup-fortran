name: aocc

on:
    push:
        branches: [main]
    pull_request:

permissions:
  contents: read

jobs:
    build:
        name: ci
        if: github.actor != 'dependabot[bot]'
        uses: ./.github/workflows/ci.yml

    integration-tests:
        name: ${{ matrix.toolchain.version }} ${{ matrix.image }} ${{
            matrix.toolchain.msystem }}
        if: github.actor != 'dependabot[bot]'
        runs-on: ${{ matrix.image }}
        needs: [build]
        strategy:
            fail-fast: false
            matrix:
                image: [ubuntu-24.04, ubuntu-22.04]

                toolchain:
                    - { compiler: aocc, version: "5.2" }
                    - { compiler: aocc, version: "5.1" }
                    - { compiler: aocc, version: "5.0" }
                    - { compiler: aocc, version: "4.2" }
                    - { compiler: aocc, version: "4.1" }

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Restore dist-tests
              uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
              with:
                  timeout_minutes: 5
                  max_attempts: 3
                  retry_wait_seconds: 10
                  command: gh run download ${{ github.run_id }} --name generated-dist-tests --dir dist-tests
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Install ${{ matrix.toolchain.compiler }} ${{ matrix.toolchain.version }}
              id: setup
              uses: ./
              with:
                  compiler: ${{ matrix.toolchain.compiler }}
                  version: ${{ matrix.toolchain.version }}

            - name: Verify installed version
              env:
                SETUP_VERSION: ${{ steps.setup.outputs.version }}
              run: 'echo "Output: $SETUP_VERSION"'

            - name: Run Integration Tests
              run: npm run integration-test
